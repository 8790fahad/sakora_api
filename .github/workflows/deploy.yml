# Pulls main on the nexifour.ng server and restarts the API.
# Repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_PORT, VPS_PASSWORD

name: Deploy Sakora API


on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/dev/sakora_api
            git pull --no-rebase origin main
            npm ci --omit=dev
            PORT=$(awk -F= '/^PORT=/{print $2}' .env | tr -d ' \r' | tail -1)
            PORT=${PORT:-5100}
            if command -v pm2 >/dev/null 2>&1 && pm2 pid sakora-api 2>/dev/null | grep -Eq '^[1-9]'; then
              pm2 restart sakora-api --update-env
            else
              if command -v fuser >/dev/null 2>&1; then
                fuser -k "${PORT}/tcp" || true
                sleep 1
              fi
              if command -v pm2 >/dev/null 2>&1; then
                pm2 start server.js --name sakora-api --cwd /home/dev/sakora_api --update-env
              else
                nohup node server.js >> /home/dev/sakora_api/server.log 2>&1 &
              fi
            fi
            mkdir -p tmp
            touch tmp/restart.txt
