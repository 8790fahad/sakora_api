# Pulls main on the nexifour.ng server and restarts the API.
# Repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_PORT, VPS_PASSWORD

name: Deploy Sakora API


on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/dev/sakora_api
            git pull --no-rebase origin main
            npm ci --omit=dev
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart sakora-api || pm2 start server.js --name sakora-api
            elif [ -d tmp ]; then
              touch tmp/restart.txt
            else
              echo "Code updated. Restart the Node app from the host if it did not reload."
            fi
