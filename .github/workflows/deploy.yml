# Pulls main on the nexifour.ng server and restarts the API.
# Repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_PORT, VPS_PASSWORD

name: Deploy Sakora API


on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/dev/sakora_api
            # Discard local VPS edits / half-merges; keep .env (gitignored).
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e tmp -e node_modules -e server.log
            npm ci --omit=dev
            if ! grep -q '^BILLING_COUPONS=' .env; then
              printf '\nBILLING_COUPONS=SAKORA100:100\n' >> .env
            fi
            if ! grep -q '^GOOGLE_CLIENT_ID=' .env; then
              printf '\nGOOGLE_CLIENT_ID=175215736246-v9d560u61pgruhqcmns43lfpoal13e89.apps.googleusercontent.com\n' >> .env
            fi
            # Apply pending migrations against the production database in .env
            npm run migrate
            PORT=$(awk -F= '/^PORT=/{print $2}' .env | tr -d ' \r' | tail -1)
            PORT=${PORT:-5100}
            if command -v pm2 >/dev/null 2>&1 && pm2 pid sakora-api 2>/dev/null | grep -Eq '^[1-9]'; then
              pm2 restart sakora-api --update-env
              if pm2 pid sakora-worker 2>/dev/null | grep -Eq '^[1-9]'; then
                pm2 restart sakora-worker --update-env
              fi
            else
              if command -v fuser >/dev/null 2>&1; then
                fuser -k "${PORT}/tcp" || true
                sleep 1
              fi
              if command -v pm2 >/dev/null 2>&1; then
                if [ -f ecosystem.config.cjs ]; then
                  pm2 start ecosystem.config.cjs --only sakora-api --update-env
                else
                  pm2 start server.js --name sakora-api --cwd /home/dev/sakora_api --update-env
                fi
              else
                nohup node server.js >> /home/dev/sakora_api/server.log 2>&1 &
              fi
            fi
            mkdir -p tmp
            touch tmp/restart.txt
